<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pips</title>

<style>
* { box-sizing: border-box; }
body { margin:0; background:white; color:black; font-family:Arial,sans-serif; }
button, select { font:inherit; }
button { cursor:pointer; }

#menu {
    min-height:100vh; display:flex; justify-content:center; align-items:center;
    gap:12px; flex-direction:column;
}
#menu select, #menu button {
    padding:12px 20px; background:white; color:black; border:1px solid black;
}
#menuTitle {
    margin:0 0 12px; font-size:42px; font-weight:700;
    letter-spacing:-1.5px; line-height:1;
}
#menu button { min-width:140px; }

#game { display:none; padding:22px 25px; max-width:1000px; margin:auto; }
#gameTop {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:12px; margin-bottom:24px; min-height:38px;
    padding-bottom:14px; border-bottom:1px solid #d5d5d5;
}
.top-left, .top-right { display:flex; align-items:center; gap:18px; }
.top-right { justify-content:flex-end; }
#gameTop button {
    border:0; background:transparent; color:black; padding:4px;
    font-size:16px; line-height:1.2;
}
#back {
    font-size:27px !important; align-self:center; line-height:1;
    position:relative; top:-2px;
}
#newPuzzle { white-space:nowrap; }
#difficultyTitle { text-align:center; font-size:16px; font-weight:600; }
#tutorialButton { font-size:21px !important; }
#clearButton { white-space:nowrap; }
#timer { font-variant-numeric:tabular-nums; min-width:42px; text-align:right; }

#boardWrap { position:relative; width:max-content; margin:0 auto 25px; }
#boardWrap::after {
    content:""; position:absolute; top:calc(100% + 25px); left:50%;
    transform:translateX(-50%); width:min(750px, calc(100vw - 50px));
    border-bottom:1px solid #d5d5d5;
}
#board {
    position:relative;
    display:grid;
    grid-template-columns:repeat(6,64px);
    grid-template-rows:repeat(6,64px);
    width:384px;
    height:384px;
}
.cell {
    position:relative; border:1px solid #aaa; display:flex; align-items:center;
    justify-content:center; background:white; overflow:visible;
}

/* Region borders: centred and extended to meet neighbouring lines */
.region-edge {
    position:absolute;
    background:black;
    pointer-events:none;
    z-index:5;
}

.region-edge.top {
    height:3px;
    left:-1px;
    right:-1px;
    top:-2.5px;
}

.region-edge.bottom {
    height:3px;
    left:-1px;
    right:-1px;
    bottom:-2.5px;
}

.region-edge.left {
    width:3px;
    top:-1px;
    bottom:-1px;
    left:-2.5px;
}

.region-edge.right {
    width:3px;
    top:-1px;
    bottom:-1px;
    right:-2.5px;
}

.cell.drop-target {
    background:#f0f0f0;
}

.region-badge {
    position:absolute; width:27px; height:27px; border:1.5px solid black;
    border-radius:50%; background:white; color:black; display:flex;
    align-items:center; justify-content:center; font-size:11px;
    font-weight:bold; line-height:1; z-index:8; right:-11px; bottom:-11px;
    padding:0; pointer-events:none; white-space:nowrap;
}
.region-badge.correct { background:#a8e6b0; }
.region-badge.incorrect { background:#f1a3a3; }

.domino-half {
    position:absolute; inset:1px; z-index:3; background:white;
    border:2px solid black; display:flex; align-items:center;
    justify-content:center; cursor:grab;
}
.domino-half:active { cursor:grabbing; }
.domino-half.horizontal.first { border-radius:7px 0 0 7px; border-right-width:1px; }
.domino-half.horizontal.second { border-radius:0 7px 7px 0; border-left-width:1px; }
.domino-half.vertical.first { border-radius:7px 7px 0 0; border-bottom-width:1px; }
.domino-half.vertical.second { border-radius:0 0 7px 7px; border-top-width:1px; }
.domino-half.selected { background:#f0f0f0; }

.pip-grid {
    width:43px; height:43px; display:grid; grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr); padding:4px;
}
.pip {
    width:7px; height:7px; background:black; border-radius:50%;
    align-self:center; justify-self:center;
}

#trayTitle { display:none; }

/* Fixed tray size */
#tray {
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    justify-content:center;
    gap:10px;
    max-width:750px;
    height:160px;
    min-height:160px;
    max-height:160px;
    margin:auto;
    padding:8px;
    border:1px dashed transparent;
    border-radius:4px;
    overflow-y:auto;
}
#tray.drop-target { border-color:#777; background:#f7f7f7; }
.tray-domino {
    display:flex; align-items:center; background:white; padding:0;
    border:0; cursor:grab;
}
.tray-domino:active { cursor:grabbing; }
.tray-domino.selected { outline:2px solid black; outline-offset:3px; }
.tray-half {
    width:39px; height:39px; border:2px solid black; display:flex;
    justify-content:center; align-items:center; background:white;
}
.tray-half:first-child { border-radius:6px 0 0 6px; border-right-width:1px; }
.tray-half:last-child { border-radius:0 6px 6px 0; border-left-width:1px; }
.tray-half .pip-grid { width:34px; height:34px; padding:3px; }
.tray-half .pip { width:6px; height:6px; }

#dominoTools {
    position:absolute; z-index:10; display:none; gap:5px;
}
#dominoTools.show { display:flex; }
.tool-button {
    width:29px; height:29px; border:1px solid black; border-radius:50%;
    background:white; display:flex; justify-content:center; align-items:center;
    font-size:17px; padding:0;
}
.tool-button:hover { background:#eee; }
#status { text-align:center; margin:18px 0; min-height:22px; }

#tutorialOverlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.25);
    z-index:100; justify-content:center; align-items:center;
}
#tutorialOverlay.show { display:flex; }
#tutorialBox {
    width:min(440px,calc(100% - 30px)); height:360px; background:white;
    border:1px solid black; padding:25px; position:relative;
    display:flex; flex-direction:column;
}
#tutorialContent { flex:1; min-height:0; overflow-y:auto; }
#tutorialClose {
    position:absolute; top:10px; right:12px; border:0; background:white;
    font-size:22px;
}
#tutorialContent { flex:1; padding:15px 5px; }
#tutorialContent h2 { margin-top:15px; }
#tutorialContent p { line-height:1.6; }
#tutorialNavigation {
    display:flex; justify-content:space-between; align-items:center; margin-top:15px;
}
#tutorialNavigation button {
    background:white; border:1px solid black; padding:7px 12px;
}
#tutorialNavigation .tutorial-dot {
    flex:0 0 10px; width:10px; min-width:10px; height:10px;
    min-height:10px; padding:0; margin:0; border:1px solid #777;
    border-radius:50%; background:white; aspect-ratio:1 / 1;
}
#tutorialNavigation .tutorial-dot.active {
    background:#888; border-color:#888;
}
.tutorial-symbol {
    display:flex; align-items:center; justify-content:center;
    min-width:48px; width:max-content; height:48px; padding:0 12px;
    margin:18px auto 10px; border:1.5px solid #555;
    border-radius:50%; background:#f5f5f5; color:#111;
    font-size:20px; font-weight:700; line-height:1;
}
.tutorial-symbol.wide { border-radius:24px; min-width:62px; }
#tutorialDots { display:flex; gap:9px; align-items:center; justify-content:center; }
.tutorial-dot {
    appearance:none; flex:0 0 9px; width:9px; min-width:9px; height:9px;
    min-height:9px; border:1px solid black; border-radius:50%;
    padding:0; margin:0; background:white; aspect-ratio:1 / 1;
}
.tutorial-dot.active { background:black; }

@media (max-width:500px) {
    #game { padding:10px; }
    #board {
        grid-template-columns:repeat(6,min(15vw,64px));
        grid-template-rows:repeat(6,min(15vw,64px));
        width:auto; height:auto;
    }
    .cell { aspect-ratio:1; }
    .pip-grid { width:90%; height:90%; }
    .pip { width:5px; height:5px; }
    #gameTop { gap:6px; }
    .top-left,.top-right { gap:9px; }
    #gameTop button { font-size:13px; }
    #back { font-size:23px !important; }
}
</style>
</head>

<body>

<div id="menu">
    <h1 id="menuTitle">Pips</h1>
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
    </select>
    <button id="play">Play</button>
</div>

<div id="game">
    <div id="gameTop">
        <div class="top-left">
            <button id="back" title="Back to menu" aria-label="Back">←</button>
            <button id="newPuzzle">New puzzle</button>
        </div>
        <strong id="difficultyTitle">Medium</strong>
        <div class="top-right">
            <button id="tutorialButton" title="Tutorial" aria-label="Tutorial">?</button>
            <button id="clearButton">Clear</button>
            <span id="timer">0:00</span>
        </div>
    </div>

    <div id="boardWrap">
        <div id="board"></div>
        <div id="dominoTools">
            <button class="tool-button" id="rotateButton" title="Rotate clockwise">↻</button>
            <button class="tool-button" id="confirmButton" title="Confirm placement">✓</button>
        </div>
    </div>

    <div id="trayTitle">Dominoes</div>
    <div id="tray"></div>
    <div id="status"></div>
</div>

<div id="tutorialOverlay">
    <div id="tutorialBox">
        <button id="tutorialClose">×</button>
        <div id="tutorialContent"></div>
        <div id="tutorialNavigation">
            <button id="tutorialPrev">←</button>
            <div id="tutorialDots"></div>
            <button id="tutorialNext">→</button>
        </div>
    </div>
</div>

<script>
const SIZE = 6;

let difficulty = "medium";
let selectedDomino = null;
let draggedDomino = null;
let regions = [];
let dominoes = [];
let boardData = [];
let tutorialPage = 0;
let timerSeconds = 0;
let timerInterval = null;

const tutorials = [
    {
        title: "The goal",
        text: "Fill the 6 × 6 board using all 18 dominoes. Each domino covers two neighbouring squares. The pips in every outlined region must follow its clue."
    },
    {
        title: "Placing dominoes",
        text: "Drag a domino from the tray and drop it onto the board. It will cover two squares horizontally or vertically, wherever there is room. You can also drag a domino directly from the tray; the rotate menu will not appear while dragging."
    },
    {
        title: "Moving and removing",
        text: "To move a domino off the board, drag either half back to the domino tray. It will return to the tray without opening the edit controls. You can then place it somewhere else."
    },
    {
        title: "Number clues",
        text: "A number means the pips in that region must add up to exactly that number. For example, 8 means all pips inside the outlined region must total 8.",
        symbol: "8"
    },
    {
        title: "Equal and not equal",
        text: "The = clue means every square in that region must have the same number of pips. The ≠ clue means every square must have a different number of pips from every other square in that region.",
        symbols: ["=", "≠"]
    },
    {
        title: "Less than and greater than",
        text: "A clue such as <8 means the total pips in that region must be less than 8. A clue such as >8 means the total must be greater than 8. The number is a limit, not the required total.",
        symbols: ["<8", ">8"]
    },
    {
        title: "Rotate and confirm",
        text: "Click a domino on the board to select it. The ↻ button rotates it clockwise, and the ✓ button confirms the placement and closes the menu. Click the selected domino again to close the menu without confirming."
    },
    {
        title: "Clue colours and toolbar",
        text: "A clue circle turns green when its region is correct and red when the region is completely filled but incorrect. The top bar contains Back, New puzzle, difficulty, Tutorial, Clear, and the timer. Clear returns every domino to the tray."
    }
];

function randomInt(max) {
    return Math.floor(Math.random() * max);
}

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function neighbours(index) {
    const row = Math.floor(index / SIZE);
    const col = index % SIZE;
    const result = [];

    if (row > 0) result.push(index - SIZE);
    if (row < SIZE - 1) result.push(index + SIZE);
    if (col > 0) result.push(index - 1);
    if (col < SIZE - 1) result.push(index + 1);

    return result;
}

const pipPatterns = {
    0: [],
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
};

function createPips(value) {
    const grid = document.createElement("div");
    grid.className = "pip-grid";

    for (let i = 0; i < 9; i++) {
        const position = document.createElement("div");

        if (pipPatterns[value].includes(i)) {
            position.className = "pip";
        }

        grid.appendChild(position);
    }

    return grid;
}

function generateTiling() {
    const occupied = Array(SIZE * SIZE).fill(false);
    const pairs = [];

    function solve() {
        const first = occupied.findIndex(value => !value);
        if (first === -1) return true;

        const possible = shuffle(
            neighbours(first).filter(index => !occupied[index])
        );

        for (const next of possible) {
            occupied[first] = true;
            occupied[next] = true;
            pairs.push([first, next]);

            if (solve()) return true;

            pairs.pop();
            occupied[first] = false;
            occupied[next] = false;
        }

        return false;
    }

    if (!solve()) {
        throw new Error("Could not generate domino layout.");
    }

    return pairs;
}

function generateRegions(values) {
    let unassigned = new Set(
        Array.from({ length: SIZE * SIZE }, (_, i) => i)
    );

    const result = [];
    let regionId = 0;

    const settings = {
        easy: { min: 4, max: 6 },
        medium: { min: 3, max: 5 },
        hard: { min: 2, max: 4 }
    };

    const config = settings[difficulty];

    while (unassigned.size > 0) {
        const start = shuffle([...unassigned])[0];
        const targetSize =
            config.min + randomInt(config.max - config.min + 1);

        const cells = [start];
        unassigned.delete(start);

        while (cells.length < targetSize) {
            let possible = [];

            for (const cell of cells) {
                for (const next of neighbours(cell)) {
                    if (unassigned.has(next)) {
                        possible.push(next);
                    }
                }
            }

            possible = [...new Set(possible)];

            if (possible.length === 0) break;

            const next = possible[randomInt(possible.length)];
            cells.push(next);
            unassigned.delete(next);
        }

        const regionValues = cells.map(cell => values[cell]);
        const total = regionValues.reduce((a, b) => a + b, 0);

        const allSame = regionValues.every(
            value => value === regionValues[0]
        );

        const allDifferent =
            new Set(regionValues).size === regionValues.length;

        let options = [
            { type: "sum", weight: difficulty === "easy" ? 75 : difficulty === "medium" ? 40 : 20 }
        ];

        if (allSame) {
            options.push({ type: "same", weight: 15 });
        }

        if (allDifferent) {
            options.push({ type: "different", weight: 15 });
        }

        options.push({
            type: "less",
            weight: difficulty === "easy" ? 5 : difficulty === "medium" ? 15 : 25
        });

        if (total > 0) {
            options.push({
                type: "greater",
                weight: difficulty === "easy" ? 0 : difficulty === "medium" ? 15 : 25
            });
        }

        options = options.filter(option => option.weight > 0);

        const totalWeight = options.reduce(
            (sum, option) => sum + option.weight, 0
        );

        let roll = Math.random() * totalWeight;
        let chosen = options[0].type;

        for (const option of options) {
            roll -= option.weight;

            if (roll <= 0) {
                chosen = option.type;
                break;
            }
        }

        let target = total;

        if (chosen === "less") {
            target = total + 1 + randomInt(3);
        }

        if (chosen === "greater") {
            target = Math.max(0, total - 1 - randomInt(3));
        }

        result.push({
            id: regionId++,
            cells,
            type: chosen,
            target
        });
    }

    return result;
}

function updateTimerDisplay() {
    const minutes = Math.floor(timerSeconds / 60);
    const seconds = String(timerSeconds % 60).padStart(2, "0");
    document.getElementById("timer").textContent = `${minutes}:${seconds}`;
}

function resetTimer() {
    if (timerInterval !== null) clearInterval(timerInterval);
    timerSeconds = 0;
    updateTimerDisplay();

    timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
    }, 1000);
}

function generatePuzzle() {
    resetTimer();

    const pairs = generateTiling();
    const values = Array(SIZE * SIZE).fill(0);

    dominoes = pairs.map((pair, id) => {
        const a = randomInt(7);
        const b = randomInt(7);

        values[pair[0]] = a;
        values[pair[1]] = b;

        return {
            id,
            a,
            b,
            placed: false,
            cells: null,
            orientation: "horizontal",
            swapped: false,
            confirmed: false
        };
    });

    regions = generateRegions(values);

    boardData = Array.from(
        { length: SIZE * SIZE },
        (_, index) => ({
            index,
            value: null,
            dominoId: null,
            regionId: null
        })
    );

    regions.forEach(region => {
        region.cells.forEach(index => {
            boardData[index].regionId = region.id;
        });
    });

    selectedDomino = null;
    draggedDomino = null;

    render();
}

function getClue(region) {
    if (region.type === "sum") return String(region.target);
    if (region.type === "same") return "=";
    if (region.type === "different") return "≠";
    if (region.type === "less") return `<${region.target}`;
    if (region.type === "greater") return `>${region.target}`;
    return "";
}

function getRegionCorner(region) {
    return Math.min(...region.cells);
}

function getDominoCells(anchor, orientation) {
    const row = Math.floor(anchor / SIZE);
    const col = anchor % SIZE;

    if (orientation === "horizontal") {
        if (col >= SIZE - 1) return null;
        return [anchor, anchor + 1];
    }

    if (row >= SIZE - 1) return null;
    return [anchor, anchor + SIZE];
}

function placeDomino(id, anchor) {
    const domino = dominoes.find(d => d.id === id);

    if (!domino || domino.placed) return false;

    let orientation = "horizontal";
    let cells = getDominoCells(anchor, orientation);

    if (
        !cells ||
        cells.some(index => boardData[index].value !== null)
    ) {
        orientation = "vertical";
        cells = getDominoCells(anchor, orientation);
    }

    if (
        !cells ||
        cells.some(index => boardData[index].value !== null)
    ) {
        return false;
    }

    domino.placed = true;
    domino.cells = cells;
    domino.orientation = orientation;
    domino.swapped = false;
    domino.confirmed = false;

    boardData[cells[0]].value = domino.a;
    boardData[cells[1]].value = domino.b;

    boardData[cells[0]].dominoId = id;
    boardData[cells[1]].dominoId = id;

    selectedDomino = null;
    return true;
}

function removeDomino(id) {
    const domino = dominoes.find(d => d.id === id);
    if (!domino || !domino.placed) return;

    domino.cells.forEach(index => {
        boardData[index].value = null;
        boardData[index].dominoId = null;
    });

    domino.placed = false;
    domino.cells = null;
    domino.confirmed = false;
    selectedDomino = null;

    render();
}

function clearBoard() {
    dominoes.forEach(domino => {
        if (!domino.placed) return;

        domino.cells.forEach(index => {
            boardData[index].value = null;
            boardData[index].dominoId = null;
        });

        domino.placed = false;
        domino.cells = null;
        domino.confirmed = false;
    });

    selectedDomino = null;
    render();
}

function rotateSelected() {
    const domino = dominoes.find(d => d.id === selectedDomino);
    if (!domino || !domino.placed) return;

    const oldOrientation = domino.orientation;
    const oldSwapped = domino.swapped;
    const oldCells = [...domino.cells];

    oldCells.forEach(index => {
        boardData[index].value = null;
        boardData[index].dominoId = null;
    });

    const newOrientation =
        oldOrientation === "horizontal" ? "vertical" : "horizontal";

    const newCells = getDominoCells(oldCells[0], newOrientation);

    if (
        !newCells ||
        newCells.some(index => boardData[index].value !== null)
    ) {
        oldCells.forEach((index, i) => {
            boardData[index].value = i === 0
                ? (oldSwapped ? domino.b : domino.a)
                : (oldSwapped ? domino.a : domino.b);

            boardData[index].dominoId = domino.id;
        });

        return;
    }

    domino.orientation = newOrientation;

    if (oldOrientation === "vertical") {
        domino.swapped = !domino.swapped;
    }

    domino.cells = newCells;

    const values = domino.swapped
        ? [domino.b, domino.a]
        : [domino.a, domino.b];

    newCells.forEach((index, i) => {
        boardData[index].value = values[i];
        boardData[index].dominoId = domino.id;
    });

    domino.confirmed = false;
    render();
}

function selectDomino(id) {
    selectedDomino = selectedDomino === id ? null : id;
    render();
}

function renderDominoHalf(cell, domino, index) {
    const half = document.createElement("div");
    half.className = "domino-half";
    half.classList.add(domino.orientation);
    half.classList.add(index === 0 ? "first" : "second");
    half.draggable = true;

    if (selectedDomino === domino.id) {
        half.classList.add("selected");
    }

    const values = domino.swapped ? [domino.b, domino.a] : [domino.a, domino.b];
    half.appendChild(createPips(values[index]));

    half.addEventListener("click", event => {
        event.stopPropagation();
        selectDomino(domino.id);
    });

    half.addEventListener("dragstart", event => {
        draggedDomino = domino.id;
        selectedDomino = null;
        document.getElementById("dominoTools").classList.remove("show");
        event.dataTransfer.setData("text/plain", String(domino.id));
        event.dataTransfer.effectAllowed = "move";
    });

    half.addEventListener("dragend", () => {
        draggedDomino = null;
    });

    return half;
}

function renderBoard() {
    const board = document.getElementById("board");
    board.innerHTML = "";

    // Assign soft colours to regions; neighbouring regions never share a colour.
    const regionPalette = [
        "#f2dada", "#d8e8f5", "#dcebd7", "#f2e3c8",
        "#e3dcf2", "#cfe9e4", "#efd8e9", "#e8e4d2"
    ];
    const regionById = new Map(regions.map(region => [region.id, region]));
    const regionAdjacency = new Map(regions.map(region => [region.id, new Set()]));
    boardData.forEach((cell, index) => {
        if (cell.regionId === null) return;
        neighbours(index).forEach(nextIndex => {
            const otherId = boardData[nextIndex]?.regionId;
            if (otherId !== undefined && otherId !== null && otherId !== cell.regionId) {
                regionAdjacency.get(cell.regionId).add(otherId);
            }
        });
    });
    regions.forEach(region => {
        const used = new Set(
            [...regionAdjacency.get(region.id)]
                .map(id => regionById.get(id)?.visualColor)
                .filter(Boolean)
        );
        region.visualColor = regionPalette.find(color => !used.has(color)) || regionPalette[region.id % regionPalette.length];
    });

    for (let i = 0; i < SIZE * SIZE; i++) {
        const cell = boardData[i];
        const row = Math.floor(i / SIZE);
        const col = i % SIZE;

        const element = document.createElement("div");
        element.className = "cell";
        const cellRegion = regionById.get(cell.regionId);
        if (cellRegion) element.style.backgroundColor = cellRegion.visualColor;

        const sameRegion = index =>
            boardData[index]?.regionId === cell.regionId;

        if (row === 0 || !sameRegion(i - SIZE)) {
            element.classList.add("region-top");
        }

        if (row === SIZE - 1) {
            element.classList.add("region-bottom");
        }

        if (col === 0 || !sameRegion(i - 1)) {
            element.classList.add("region-left");
        }

        if (col === SIZE - 1) {
            element.classList.add("region-right");
        }

        // Add individual border elements for precise alignment.
        ["top", "left", "bottom", "right"].forEach(side => {
            if (element.classList.contains(`region-${side}`)) {
                const edge = document.createElement("div");
                edge.className = `region-edge ${side}`;
                element.appendChild(edge);
            }
        });

        if (cell.dominoId !== null) {
            const domino = dominoes.find(d => d.id === cell.dominoId);
            const halfIndex = domino.cells.indexOf(i);

            element.appendChild(
                renderDominoHalf(cell, domino, halfIndex)
            );
        }

        element.addEventListener("click", () => {
            if (cell.dominoId !== null) {
                selectDomino(cell.dominoId);
                return;
            }

            if (
                selectedDomino !== null &&
                !dominoes.find(d => d.id === selectedDomino).placed
            ) {
                placeDomino(selectedDomino, i);
                render();
            }
        });

        element.addEventListener("dragover", event => {
            event.preventDefault();
            element.classList.add("drop-target");
        });

        element.addEventListener("dragleave", () => {
            element.classList.remove("drop-target");
        });

        element.addEventListener("drop", event => {
            event.preventDefault();
            element.classList.remove("drop-target");

            const transferredId = event.dataTransfer.getData("text/plain");
            const id = transferredId !== "" ? Number(transferredId) : draggedDomino;
            const moving = dominoes.find(d => d.id === id);

            if (moving && !moving.placed) {
                if (placeDomino(id, i)) render();
            }

            draggedDomino = null;
        });

        board.appendChild(element);
    }

    // Put each clue in a circle at the bottom-right edge of its region.
    regions.forEach(region => {
        const badgeCell = Math.max(...region.cells);
        const badge = document.createElement("div");
        const result = checkRegion(region);

        badge.className = "region-badge";
        badge.textContent = getClue(region);

        if (result === true) badge.classList.add("correct");
        if (result === false) badge.classList.add("incorrect");

        board.children[badgeCell].appendChild(badge);
    });

    updateDominoTools();
}

function renderTray() {
    const tray = document.getElementById("tray");
    tray.innerHTML = "";

    dominoes.forEach(domino => {
        if (domino.placed) return;

        const element = document.createElement("div");
        element.className = "tray-domino";
        element.draggable = true;

        if (selectedDomino === domino.id) element.classList.add("selected");

        const first = document.createElement("div");
        first.className = "tray-half";
        first.appendChild(createPips(domino.a));

        const second = document.createElement("div");
        second.className = "tray-half";
        second.appendChild(createPips(domino.b));

        element.appendChild(first);
        element.appendChild(second);

        element.addEventListener("click", () => selectDomino(domino.id));

        element.addEventListener("dragstart", event => {
            draggedDomino = domino.id;
            selectedDomino = null;
            document.getElementById("dominoTools").classList.remove("show");
            event.dataTransfer.setData("text/plain", String(domino.id));
            event.dataTransfer.effectAllowed = "move";
        });

        element.addEventListener("dragend", () => {
            draggedDomino = null;
        });

        tray.appendChild(element);
    });

    tray.ondragover = event => {
        event.preventDefault();
        tray.classList.add("drop-target");
        event.dataTransfer.dropEffect = "move";
    };

    tray.ondragleave = event => {
        if (!tray.contains(event.relatedTarget)) {
            tray.classList.remove("drop-target");
        }
    };

    tray.ondrop = event => {
        event.preventDefault();
        tray.classList.remove("drop-target");

        const transferredId = event.dataTransfer.getData("text/plain");
        const id = transferredId !== "" ? Number(transferredId) : draggedDomino;
        const domino = dominoes.find(d => d.id === id);

        if (domino && domino.placed) removeDomino(id);
        draggedDomino = null;
    };
}

function updateDominoTools() {
    const tools = document.getElementById("dominoTools");
    const domino = dominoes.find(d => d.id === selectedDomino);

    if (!domino || !domino.placed) {
        tools.classList.remove("show");
        return;
    }

    const anchor = domino.cells[0];
    const row = Math.floor(anchor / SIZE);
    const col = anchor % SIZE;
    const cellSize = document.querySelector(".cell")?.getBoundingClientRect().width || 64;

    const left = Math.min(
        col * cellSize,
        SIZE * cellSize - 65
    );

    const top = Math.max(
        row * cellSize - 34,
        -30
    );

    tools.style.left = `${left}px`;
    tools.style.top = `${top}px`;
    tools.classList.add("show");
}

function checkRegion(region) {
    const values = region.cells.map(
        index => boardData[index].value
    );

    if (values.some(value => value === null)) {
        return null;
    }

    const total = values.reduce((a, b) => a + b, 0);

    if (region.type === "sum") {
        return total === region.target;
    }

    if (region.type === "same") {
        return values.every(value => value === values[0]);
    }

    if (region.type === "different") {
        return new Set(values).size === values.length;
    }

    if (region.type === "less") {
        return total < region.target;
    }

    if (region.type === "greater") {
        return total > region.target;
    }

    return false;
}

function checkProgress() {
    const filled = boardData.filter(cell => cell.value !== null).length;
    const status = document.getElementById("status");

    if (filled === SIZE * SIZE && regions.every(region => checkRegion(region) === true)) {
        status.textContent = "Puzzle completed! You solved it!";
    } else {
        status.textContent = "";
    }
}

function render() {
    renderBoard();
    renderTray();
    checkProgress();
}

function renderTutorial() {
    const content = document.getElementById("tutorialContent");
    const dots = document.getElementById("tutorialDots");
    const page = tutorials[tutorialPage];

    const symbolMarkup = page.symbol
        ? `<div class="tutorial-symbol">${page.symbol}</div>`
        : page.symbols
            ? `<div style="display:flex;justify-content:center;gap:12px;">${page.symbols.map(symbol => `<div class="tutorial-symbol wide">${symbol}</div>`).join("")}</div>`
            : "";

    content.innerHTML = `
        <h2>${page.title}</h2>
        ${symbolMarkup}
        <p>${page.text}</p>
    `;

    dots.innerHTML = "";

    tutorials.forEach((item, index) => {
        const dot = document.createElement("button");
        dot.className = "tutorial-dot";

        if (index === tutorialPage) {
            dot.classList.add("active");
        }

        dot.addEventListener("click", () => {
            tutorialPage = index;
            renderTutorial();
        });

        dots.appendChild(dot);
    });

    document.getElementById("tutorialPrev").disabled =
        tutorialPage === 0;

    document.getElementById("tutorialNext").disabled =
        tutorialPage === tutorials.length - 1;
}

function openTutorial() {
    tutorialPage = 0;
    renderTutorial();
    document.getElementById("tutorialOverlay").classList.add("show");
}

function closeTutorial() {
    document.getElementById("tutorialOverlay").classList.remove("show");
}

document.getElementById("play").addEventListener("click", () => {
    difficulty = document.getElementById("difficulty").value;

    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("difficultyTitle").textContent =
        difficulty.charAt(0).toUpperCase() + difficulty.slice(1);

    generatePuzzle();
});

document.getElementById("back").addEventListener("click", () => {
    document.getElementById("game").style.display = "none";
    document.getElementById("menu").style.display = "flex";
    selectedDomino = null;

    if (timerInterval !== null) clearInterval(timerInterval);
    timerInterval = null;
});

document.getElementById("newPuzzle").addEventListener("click", () => {
    generatePuzzle();
});

document.getElementById("clearButton").addEventListener("click", clearBoard);
document.getElementById("rotateButton").addEventListener("click", rotateSelected);

document.getElementById("confirmButton").addEventListener("click", () => {
    const domino = dominoes.find(d => d.id === selectedDomino);

    if (domino) {
        domino.confirmed = true;
    }

    selectedDomino = null;
    render();
});

document.getElementById("tutorialButton")
    .addEventListener("click", openTutorial);

document.getElementById("tutorialClose")
    .addEventListener("click", closeTutorial);

document.getElementById("tutorialPrev")
    .addEventListener("click", () => {
        if (tutorialPage > 0) {
            tutorialPage--;
            renderTutorial();
        }
    });

document.getElementById("tutorialNext")
    .addEventListener("click", () => {
        if (tutorialPage < tutorials.length - 1) {
            tutorialPage++;
            renderTutorial();
        }
    });

document.getElementById("tutorialOverlay")
    .addEventListener("click", event => {
        if (event.target.id === "tutorialOverlay") {
            closeTutorial();
        }
    });
</script>
