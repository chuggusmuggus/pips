
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pips</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
}

button, select {
    font: inherit;
}

#menu {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-direction: column;
}

#menu select,
#menu button {
    padding: 12px 20px;
    background: white;
    color: black;
    border: 1px solid black;
    cursor: pointer;
}

#menu button {
    min-width: 140px;
}

#game {
    display: none;
    padding: 25px;
    max-width: 900px;
    margin: auto;
}

#gameTop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

#gameTop button,
#controls button {
    background: white;
    border: 1px solid black;
    padding: 8px 13px;
    cursor: pointer;
}

#board {
    display: grid;
    grid-template-columns: repeat(6, 64px);
    grid-template-rows: repeat(6, 64px);
    width: max-content;
    margin: 0 auto 25px;
}

.cell {
    position: relative;
    border: 1px solid #aaa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    cursor: pointer;
    user-select: none;
}

.cell.region-top {
    border-top: 3px solid black;
}

.cell.region-bottom {
    border-bottom: 3px solid black;
}

.cell.region-left {
    border-left: 3px solid black;
}

.cell.region-right {
    border-right: 3px solid black;
}

.cell.selected {
    background: #e8e8e8;
}

.cell.filled {
    background: #f3f3f3;
}

.cell .clue {
    position: absolute;
    top: 2px;
    left: 3px;
    font-size: 9px;
    font-weight: bold;
    max-width: 58px;
    line-height: 1.1;
}

#tray {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 700px;
    margin: auto;
}

.domino {
    display: flex;
    border: 1px solid black;
    background: white;
    cursor: pointer;
    min-width: 76px;
    height: 42px;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.domino span {
    padding: 0 9px;
}

.domino.selected {
    background: #e5e5e5;
    outline: 2px solid black;
}

.domino.used {
    display: none;
}

#controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

#status {
    text-align: center;
    margin: 15px 0;
    min-height: 24px;
}

#progress {
    text-align: center;
    margin-bottom: 15px;
}

#instructions {
    text-align: center;
    margin: 10px;
    font-size: 14px;
}

@media (max-width: 600px) {
    #game {
        padding: 10px;
    }

    #board {
        grid-template-columns: repeat(6, min(14vw, 64px));
        grid-template-rows: repeat(6, min(14vw, 64px));
    }

    .cell {
        font-size: 20px;
    }

    .cell .clue {
        font-size: 7px;
    }
}
</style>
</head>

<body>

<!-- HOME MENU -->

<div id="menu">

    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
    </select>

    <button id="play">Play</button>

</div>


<!-- GAME -->

<div id="game">

    <div id="gameTop">
        <button id="back">Back</button>
        <strong id="difficultyTitle">Medium</strong>
        <button id="newPuzzle">New puzzle</button>
    </div>

    <div id="progress"></div>

    <div id="board"></div>

    <div id="instructions">
        Select a domino, then click two adjacent empty squares to place it.
        Select a placed domino to remove it.
    </div>

    <div id="controls">
        <button id="flip">Flip domino</button>
        <button id="clearSelection">Deselect</button>
    </div>

    <div id="tray"></div>

    <div id="status"></div>

</div>


<script>

// --------------------------------------------------
// GAME STATE
// --------------------------------------------------

const SIZE = 6;

let difficulty = "medium";
let puzzle = null;

let selectedDomino = null;
let firstCell = null;
let flipped = false;

let boardData = [];
let dominoes = [];
let regions = [];


// --------------------------------------------------
// RANDOM HELPERS
// --------------------------------------------------

function randomInt(max) {
    return Math.floor(Math.random() * max);
}

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function neighbours(index) {
    const row = Math.floor(index / SIZE);
    const col = index % SIZE;

    const result = [];

    if (row > 0) result.push(index - SIZE);
    if (row < SIZE - 1) result.push(index + SIZE);
    if (col > 0) result.push(index - 1);
    if (col < SIZE - 1) result.push(index + 1);

    return result;
}


// --------------------------------------------------
// GENERATE DOMINO LAYOUT
// --------------------------------------------------

function generateTiling() {

    const occupied = Array(SIZE * SIZE).fill(false);
    const pairs = [];

    function solve() {

        let first = occupied.findIndex(value => !value);

        if (first === -1) {
            return true;
        }

        const possible = shuffle(
            neighbours(first).filter(index => !occupied[index])
        );

        for (const next of possible) {

            occupied[first] = true;
            occupied[next] = true;

            pairs.push([first, next]);

            if (solve()) {
                return true;
            }

            pairs.pop();

            occupied[first] = false;
            occupied[next] = false;
        }

        return false;
    }

    if (!solve()) {
        throw new Error("Could not generate domino layout.");
    }

    return pairs;
}


// --------------------------------------------------
// GENERATE CONNECTED REGIONS
// --------------------------------------------------

function generateRegions(values) {

    let unassigned = new Set(
        Array.from({ length: SIZE * SIZE }, (_, i) => i)
    );

    let result = [];
    let regionId = 0;

    const settings = {
        easy: { min: 4, max: 6 },
        medium: { min: 3, max: 5 },
        hard: { min: 2, max: 4 }
    };

    const config = settings[difficulty];

    while (unassigned.size > 0) {

        const start = shuffle([...unassigned])[0];

        const targetSize =
            config.min + randomInt(config.max - config.min + 1);

        let cells = [start];
        unassigned.delete(start);

        while (cells.length < targetSize) {

            let possible = [];

            for (const cell of cells) {
                for (const next of neighbours(cell)) {
                    if (unassigned.has(next)) {
                        possible.push(next);
                    }
                }
            }

            possible = [...new Set(possible)];

            if (possible.length === 0) break;

            const next = possible[randomInt(possible.length)];

            cells.push(next);
            unassigned.delete(next);
        }

        const regionValues = cells.map(cell => values[cell]);

        let type = "sum";
        let target = regionValues.reduce((a, b) => a + b, 0);

        const allSame = regionValues.every(
            value => value === regionValues[0]
        );

        const allDifferent =
            new Set(regionValues).size === regionValues.length;

        if (difficulty !== "easy") {

            const chance = Math.random();

            if (allSame && chance < (difficulty === "hard" ? .55 : .35)) {
                type = "same";
                target = regionValues[0];
            }

            else if (
                allDifferent &&
                chance < (difficulty === "hard" ? .8 : .55)
            ) {
                type = "different";
                target = null;
            }
        }

        result.push({
            id: regionId++,
            cells,
            type,
            target
        });
    }

    return result;
}


// --------------------------------------------------
// GENERATE COMPLETE PUZZLE
// --------------------------------------------------

function generatePuzzle() {

    const pairs = generateTiling();

    const values = Array(SIZE * SIZE).fill(0);

    dominoes = pairs.map((pair, id) => {

        const a = randomInt(7);
        const b = randomInt(7);

        values[pair[0]] = a;
        values[pair[1]] = b;

        return {
            id,
            a,
            b,
            placed: false,
            cells: null
        };
    });

    regions = generateRegions(values);

    boardData = Array.from(
        { length: SIZE * SIZE },
        (_, index) => ({
            index,
            value: null,
            dominoId: null,
            regionId: null
        })
    );

    regions.forEach(region => {
        region.cells.forEach(index => {
            boardData[index].regionId = region.id;
        });
    });

    selectedDomino = null;
    firstCell = null;
    flipped = false;

    render();
}


// --------------------------------------------------
// BOARD RENDERING
// --------------------------------------------------

function renderBoard() {

    const board = document.getElementById("board");

    board.innerHTML = "";

    for (let i = 0; i < SIZE * SIZE; i++) {

        const cell = boardData[i];
        const row = Math.floor(i / SIZE);
        const col = i % SIZE;

        const element = document.createElement("div");

        element.className = "cell";

        const region = regions[cell.regionId];

        const top = row === 0 ||
            boardData[i - SIZE]?.regionId !== cell.regionId;

        const bottom = row === SIZE - 1 ||
            boardData[i + SIZE]?.regionId !== cell.regionId;

        const left = col === 0 ||
            boardData[i - 1]?.regionId !== cell.regionId;

        const right = col === SIZE - 1 ||
            boardData[i + 1]?.regionId !== cell.regionId;

        if (top) element.classList.add("region-top");
        if (bottom) element.classList.add("region-bottom");
        if (left) element.classList.add("region-left");
        if (right) element.classList.add("region-right");

        if (cell.value !== null) {
            element.classList.add("filled");
            element.textContent = cell.value;
        }

        if (firstCell === i) {
            element.classList.add("selected");
        }

        const firstRegionCell = region.cells[0];

        if (i === firstRegionCell) {

            const clue = document.createElement("span");
            clue.className = "clue";

            if (region.type === "sum") {
                clue.textContent = `Sum: ${region.target}`;
            }

            else if (region.type === "same") {
                clue.textContent = "All equal";
            }

            else {
                clue.textContent = "All different";
            }

            element.appendChild(clue);
        }

        element.addEventListener("click", () => {
            clickCell(i);
        });

        board.appendChild(element);
    }
}


// --------------------------------------------------
// DOMINO TRAY
// --------------------------------------------------

function renderTray() {

    const tray = document.getElementById("tray");

    tray.innerHTML = "";

    dominoes.forEach(domino => {

        const element = document.createElement("button");

        element.className = "domino";

        if (domino.placed) {
            element.classList.add("used");
        }

        if (selectedDomino === domino.id) {
            element.classList.add("selected");
        }

        const a = flipped ? domino.b : domino.a;
        const b = flipped ? domino.a : domino.b;

        element.innerHTML = `
            <span>${a}</span>
            <span>|</span>
            <span>${b}</span>
        `;

        element.addEventListener("click", () => {

            if (domino.placed) return;

            selectedDomino = domino.id;
            firstCell = null;
            flipped = false;

            render();
        });

        tray.appendChild(element);
    });
}


// --------------------------------------------------
// PLACE AND REMOVE DOMINOES
// --------------------------------------------------

function clickCell(index) {

    const cell = boardData[index];

    // Remove a placed domino

    if (cell.dominoId !== null) {

        const domino = dominoes.find(
            d => d.id === cell.dominoId
        );

        domino.cells.forEach(position => {

            boardData[position].value = null;
            boardData[position].dominoId = null;

        });

        domino.placed = false;
        domino.cells = null;

        selectedDomino = null;
        firstCell = null;

        render();
        return;
    }

    if (selectedDomino === null) {
        document.getElementById("status").textContent =
            "Select a domino first.";
        return;
    }

    if (firstCell === null) {

        firstCell = index;

        render();
        return;
    }

    // The two squares must be adjacent

    if (!neighbours(firstCell).includes(index)) {

        firstCell = index;
        render();

        document.getElementById("status").textContent =
            "Choose a square next to the selected square.";

        return;
    }

    const domino = dominoes.find(
        d => d.id === selectedDomino
    );

    if (cell.value !== null || boardData[firstCell].value !== null) {
        return;
    }

    const a = flipped ? domino.b : domino.a;
    const b = flipped ? domino.a : domino.b;

    boardData[firstCell].value = a;
    boardData[index].value = b;

    boardData[firstCell].dominoId = domino.id;
    boardData[index].dominoId = domino.id;

    domino.placed = true;
    domino.cells = [firstCell, index];

    selectedDomino = null;
    firstCell = null;
    flipped = false;

    render();
    checkProgress();
}


// --------------------------------------------------
// CHECK REGION RULES
// --------------------------------------------------

function checkRegion(region) {

    const values = region.cells.map(
        index => boardData[index].value
    );

    if (values.some(value => value === null)) {
        return null;
    }

    if (region.type === "sum") {

        const total = values.reduce((a, b) => a + b, 0);

        return total === region.target;
    }

    if (region.type === "same") {

        return values.every(value => value === values[0]);
    }

    if (region.type === "different") {

        return new Set(values).size === values.length;
    }

    return false;
}


// --------------------------------------------------
// PROGRESS AND WIN CONDITION
// --------------------------------------------------

function checkProgress() {

    const filled = boardData.filter(
        cell => cell.value !== null
    ).length;

    const completed = regions.filter(
        region => checkRegion(region) === true
    ).length;

    document.getElementById("progress").textContent =
        `${filled} / 36 squares filled`;

    if (filled !== 36) {
        document.getElementById("status").textContent =
            `${completed} / ${regions.length} regions satisfied`;
        return;
    }

    const allCorrect = regions.every(
        region => checkRegion(region) === true
    );

    if (allCorrect) {

        document.getElementById("status").textContent =
            "Puzzle completed! You solved it!";

    } else {

        document.getElementById("status").textContent =
            "Some regions are incorrect. Try moving your dominoes.";
    }
}


// --------------------------------------------------
// MAIN RENDER
// --------------------------------------------------

function render() {

    renderBoard();
    renderTray();

    checkProgress();
}


// --------------------------------------------------
// BUTTONS
// --------------------------------------------------

document.getElementById("play").addEventListener("click", () => {

    difficulty = document.getElementById("difficulty").value;

    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("difficultyTitle").textContent =
        difficulty.charAt(0).toUpperCase() + difficulty.slice(1);

    generatePuzzle();
});


document.getElementById("back").addEventListener("click", () => {

    document.getElementById("game").style.display = "none";
    document.getElementById("menu").style.display = "flex";

});


document.getElementById("newPuzzle").addEventListener("click", () => {
    generatePuzzle();
});


document.getElementById("flip").addEventListener("click", () => {

    if (selectedDomino === null) return;

    flipped = !flipped;

    render();
});


document.getElementById("clearSelection").addEventListener("click", () => {

    selectedDomino = null;
    firstCell = null;
    flipped = false;

    render();
});

</script>

</body>
</html>
