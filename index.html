
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pips</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
}

button, select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* HOME MENU */

#menu {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-direction: column;
}

#menu select,
#menu button {
    padding: 12px 20px;
    background: white;
    color: black;
    border: 1px solid black;
}

#menu button {
    min-width: 140px;
}

/* GAME */

#game {
    display: none;
    padding: 25px;
    max-width: 950px;
    margin: auto;
}

#gameTop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

#gameTop button,
#controls button {
    background: white;
    border: 1px solid black;
    padding: 8px 13px;
}

#progress {
    text-align: center;
    margin-bottom: 15px;
}

#status {
    text-align: center;
    margin: 18px 0;
    min-height: 24px;
}

/* BOARD */

#boardWrap {
    position: relative;
    width: max-content;
    margin: 0 auto 25px;
}

#board {
    display: grid;
    grid-template-columns: repeat(6, 64px);
    grid-template-rows: repeat(6, 64px);
    width: 384px;
    height: 384px;
}

.cell {
    position: relative;
    border: 1px solid #aaa;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: white;
}

.cell.region-top {
    border-top: 3px solid black;
}

.cell.region-bottom {
    border-bottom: 3px solid black;
}

.cell.region-left {
    border-left: 3px solid black;
}

.cell.region-right {
    border-right: 3px solid black;
}

.cell.drop-target {
    background: #f0f0f0;
}

.region-clue {
    position: absolute;
    top: 2px;
    left: 3px;
    z-index: 2;
    font-size: 12px;
    font-weight: bold;
    background: white;
    padding: 1px 3px;
    pointer-events: none;
}

/* DOMINO HALVES ON BOARD */

.domino-half {
    position: absolute;
    inset: 1px;
    z-index: 3;
    background: white;
    border: 2px solid black;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.domino-half.horizontal.first {
    border-radius: 7px 0 0 7px;
    border-right-width: 1px;
}

.domino-half.horizontal.second {
    border-radius: 0 7px 7px 0;
    border-left-width: 1px;
}

.domino-half.vertical.first {
    border-radius: 7px 7px 0 0;
    border-bottom-width: 1px;
}

.domino-half.vertical.second {
    border-radius: 0 0 7px 7px;
    border-top-width: 1px;
}

.domino-half.selected {
    background: #f0f0f0;
}

/* PIPS */

.pip-grid {
    width: 43px;
    height: 43px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 4px;
}

.pip {
    width: 7px;
    height: 7px;
    background: black;
    border-radius: 50%;
    align-self: center;
    justify-self: center;
}

/* DOMINO TRAY */

#trayTitle {
    text-align: center;
    margin: 15px 0 10px;
}

#tray {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 750px;
    margin: auto;
}

.tray-domino {
    display: flex;
    align-items: center;
    background: white;
    padding: 0;
    border: none;
    cursor: grab;
}

.tray-domino:active {
    cursor: grabbing;
}

.tray-domino.selected {
    outline: 2px solid black;
    outline-offset: 3px;
}

.tray-half {
    width: 39px;
    height: 39px;
    border: 2px solid black;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
}

.tray-half:first-child {
    border-radius: 6px 0 0 6px;
    border-right-width: 1px;
}

.tray-half:last-child {
    border-radius: 0 6px 6px 0;
    border-left-width: 1px;
}

.tray-half .pip-grid {
    width: 34px;
    height: 34px;
    padding: 3px;
}

.tray-half .pip {
    width: 6px;
    height: 6px;
}

/* PLACEMENT CONTROLS */

#dominoTools {
    position: absolute;
    z-index: 10;
    display: none;
    gap: 5px;
}

#dominoTools.show {
    display: flex;
}

.tool-button {
    width: 29px;
    height: 29px;
    border: 1px solid black;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 17px;
    padding: 0;
}

.tool-button:hover {
    background: #eee;
}

/* TUTORIAL */

#tutorialOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.25);
    z-index: 100;
    justify-content: center;
    align-items: center;
}

#tutorialOverlay.show {
    display: flex;
}

#tutorialBox {
    width: min(440px, calc(100% - 30px));
    min-height: 300px;
    background: white;
    border: 1px solid black;
    padding: 25px;
    position: relative;
    display: flex;
    flex-direction: column;
}

#tutorialClose {
    position: absolute;
    top: 10px;
    right: 12px;
    border: none;
    background: white;
    font-size: 22px;
}

#tutorialContent {
    flex: 1;
    padding: 15px 5px;
}

#tutorialContent h2 {
    margin-top: 15px;
}

#tutorialContent p {
    line-height: 1.6;
}

#tutorialNavigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
}

#tutorialNavigation button {
    background: white;
    border: 1px solid black;
    padding: 7px 12px;
}

#tutorialDots {
    display: flex;
    gap: 8px;
    align-items: center;
}

.tutorial-dot {
    width: 9px;
    height: 9px;
    border: 1px solid black;
    border-radius: 50%;
    padding: 0;
    background: white;
}

.tutorial-dot.active {
    background: black;
}

@media (max-width: 500px) {
    #game {
        padding: 10px;
    }

    #board {
        grid-template-columns: repeat(6, min(15vw, 64px));
        grid-template-rows: repeat(6, min(15vw, 64px));
        width: auto;
        height: auto;
    }

    .cell {
        aspect-ratio: 1;
    }

    .region-clue {
        font-size: 9px;
    }

    .pip-grid {
        width: 90%;
        height: 90%;
    }

    .pip {
        width: 5px;
        height: 5px;
    }

    #gameTop {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<!-- HOME -->

<div id="menu">
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
    </select>

    <button id="play">Play</button>
</div>


<!-- GAME -->

<div id="game">

    <div id="gameTop">
        <button id="back">Back</button>
        <strong id="difficultyTitle">Medium</strong>
        <button id="tutorialButton">Tutorial</button>
        <button id="newPuzzle">New puzzle</button>
    </div>

    <div id="progress"></div>

    <div id="boardWrap">

        <div id="board"></div>

        <div id="dominoTools">
            <button class="tool-button" id="rotateButton" title="Rotate clockwise">↻</button>
            <button class="tool-button" id="confirmButton" title="Confirm placement">✓</button>
        </div>

    </div>

    <div id="trayTitle">Dominoes</div>

    <div id="tray"></div>

    <div id="status"></div>

</div>


<!-- TUTORIAL -->

<div id="tutorialOverlay">

    <div id="tutorialBox">

        <button id="tutorialClose">×</button>

        <div id="tutorialContent"></div>

        <div id="tutorialNavigation">

            <button id="tutorialPrev">←</button>

            <div id="tutorialDots"></div>

            <button id="tutorialNext">→</button>

        </div>

    </div>

</div>


<script>

// --------------------------------------------------
// GAME STATE
// --------------------------------------------------

const SIZE = 6;

let difficulty = "medium";
let selectedDomino = null;
let draggedDomino = null;
let regions = [];
let dominoes = [];
let boardData = [];
let tutorialPage = 0;

const tutorials = [
    {
        title: "How to play",
        text: "Your goal is to fill the entire board using every domino. Each domino has two numbers, shown as dots called pips. Drag a domino from the tray onto two adjacent squares."
    },
    {
        title: "Sum clues",
        text: "A number in the corner of a region means that all the pips inside that region must add up to that number. For example, 5 means the total must equal 5."
    },
    {
        title: "Equal and not equal",
        text: "The = symbol means every square in that region must contain the same number of pips. The ≠ symbol means every square must contain a different number of pips."
    },
    {
        title: "Less than and greater than",
        text: "A clue such as <5 means the total number of pips in that region must be less than 5. A clue such as >5 means the total must be greater than 5."
    },
    {
        title: "Rotating dominoes",
        text: "After placing a domino, click either half to select it. Use the small circular arrow to rotate it clockwise. Press the tick to confirm. Click the selected domino again to deselect it."
    },
    {
        title: "Moving dominoes",
        text: "You can drag dominoes from the tray onto the board. To remove a placed domino and return it to the tray, double-click either half of it."
    }
];


// --------------------------------------------------
// RANDOM HELPERS
// --------------------------------------------------

function randomInt(max) {
    return Math.floor(Math.random() * max);
}

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function neighbours(index) {
    const row = Math.floor(index / SIZE);
    const col = index % SIZE;

    const result = [];

    if (row > 0) result.push(index - SIZE);
    if (row < SIZE - 1) result.push(index + SIZE);
    if (col > 0) result.push(index - 1);
    if (col < SIZE - 1) result.push(index + 1);

    return result;
}


// --------------------------------------------------
// PIP DISPLAY
// --------------------------------------------------

const pipPatterns = {
    0: [],
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
};

function createPips(value) {

    const grid = document.createElement("div");
    grid.className = "pip-grid";

    for (let i = 0; i < 9; i++) {

        const position = document.createElement("div");

        if (pipPatterns[value].includes(i)) {
            position.className = "pip";
        }

        grid.appendChild(position);
    }

    return grid;
}


// --------------------------------------------------
// GENERATE DOMINO LAYOUT
// --------------------------------------------------

function generateTiling() {

    const occupied = Array(SIZE * SIZE).fill(false);
    const pairs = [];

    function solve() {

        const first = occupied.findIndex(value => !value);

        if (first === -1) return true;

        const possible = shuffle(
            neighbours(first).filter(index => !occupied[index])
        );

        for (const next of possible) {

            occupied[first] = true;
            occupied[next] = true;

            pairs.push([first, next]);

            if (solve()) return true;

            pairs.pop();

            occupied[first] = false;
            occupied[next] = false;
        }

        return false;
    }

    if (!solve()) {
        throw new Error("Could not generate domino layout.");
    }

    return pairs;
}


// --------------------------------------------------
// GENERATE CONNECTED REGIONS
// --------------------------------------------------

function generateRegions(values) {

    let unassigned = new Set(
        Array.from({ length: SIZE * SIZE }, (_, i) => i)
    );

    const result = [];
    let regionId = 0;

    const settings = {
        easy: { min: 4, max: 6 },
        medium: { min: 3, max: 5 },
        hard: { min: 2, max: 4 }
    };

    const config = settings[difficulty];

    while (unassigned.size > 0) {

        const start = shuffle([...unassigned])[0];

        const targetSize =
            config.min + randomInt(config.max - config.min + 1);

        const cells = [start];
        unassigned.delete(start);

        while (cells.length < targetSize) {

            let possible = [];

            for (const cell of cells) {
                for (const next of neighbours(cell)) {
                    if (unassigned.has(next)) {
                        possible.push(next);
                    }
                }
            }

            possible = [...new Set(possible)];

            if (possible.length === 0) break;

            const next = possible[randomInt(possible.length)];

            cells.push(next);
            unassigned.delete(next);
        }

        const regionValues = cells.map(cell => values[cell]);
        const total = regionValues.reduce((a, b) => a + b, 0);

        const allSame = regionValues.every(
            value => value === regionValues[0]
        );

        const allDifferent =
            new Set(regionValues).size === regionValues.length;

        let options = [
            { type: "sum", weight: difficulty === "easy" ? 75 : difficulty === "medium" ? 40 : 20 }
        ];

        if (allSame) {
            options.push({ type: "same", weight: 15 });
        }

        if (allDifferent) {
            options.push({ type: "different", weight: 15 });
        }

        options.push({
            type: "less",
            weight: difficulty === "easy" ? 5 : difficulty === "medium" ? 15 : 25
        });

        if (total > 0) {
            options.push({
                type: "greater",
                weight: difficulty === "easy" ? 0 : difficulty === "medium" ? 15 : 25
            });
        }

        options = options.filter(option => option.weight > 0);

        const totalWeight = options.reduce(
            (sum, option) => sum + option.weight, 0
        );

        let roll = Math.random() * totalWeight;
        let chosen = options[0].type;

        for (const option of options) {
            roll -= option.weight;

            if (roll <= 0) {
                chosen = option.type;
                break;
            }
        }

        let target = total;

        if (chosen === "less") {
            target = total + 1 + randomInt(3);
        }

        if (chosen === "greater") {
            target = Math.max(0, total - 1 - randomInt(3));
        }

        result.push({
            id: regionId++,
            cells,
            type: chosen,
            target
        });
    }

    return result;
}


// --------------------------------------------------
// GENERATE PUZZLE
// --------------------------------------------------

function generatePuzzle() {

    const pairs = generateTiling();

    const values = Array(SIZE * SIZE).fill(0);

    dominoes = pairs.map((pair, id) => {

        const a = randomInt(7);
        const b = randomInt(7);

        values[pair[0]] = a;
        values[pair[1]] = b;

        return {
            id,
            a,
            b,
            placed: false,
            cells: null,
            orientation: "horizontal",
            swapped: false,
            confirmed: false
        };
    });

    regions = generateRegions(values);

    boardData = Array.from(
        { length: SIZE * SIZE },
        (_, index) => ({
            index,
            value: null,
            dominoId: null,
            regionId: null
        })
    );

    regions.forEach(region => {
        region.cells.forEach(index => {
            boardData[index].regionId = region.id;
        });
    });

    selectedDomino = null;
    draggedDomino = null;

    render();
}


// --------------------------------------------------
// REGION CLUES
// --------------------------------------------------

function getClue(region) {

    if (region.type === "sum") return String(region.target);
    if (region.type === "same") return "=";
    if (region.type === "different") return "≠";
    if (region.type === "less") return `<${region.target}`;
    if (region.type === "greater") return `>${region.target}`;

    return "";
}

function getRegionCorner(region) {

    return Math.min(...region.cells.map(index => {
        const row = Math.floor(index / SIZE);
        const col = index % SIZE;
        return row * 100 + col;
    }));
}


// --------------------------------------------------
// GET DOMINO CELLS
// --------------------------------------------------

function getDominoCells(anchor, orientation) {

    const row = Math.floor(anchor / SIZE);
    const col = anchor % SIZE;

    if (orientation === "horizontal") {

        if (col >= SIZE - 1) return null;

        return [anchor, anchor + 1];
    }

    if (row >= SIZE - 1) return null;

    return [anchor, anchor + SIZE];
}


// --------------------------------------------------
// PLACE DOMINO
// --------------------------------------------------

function placeDomino(id, anchor) {

    const domino = dominoes.find(d => d.id === id);

    if (!domino || domino.placed) return false;

    let orientation = "horizontal";
    let cells = getDominoCells(anchor, orientation);

    if (
        !cells ||
        cells.some(index => boardData[index].value !== null)
    ) {
        orientation = "vertical";
        cells = getDominoCells(anchor, orientation);
    }

    if (
        !cells ||
        cells.some(index => boardData[index].value !== null)
    ) {
        document.getElementById("status").textContent =
            "There isn't enough room for that domino there.";
        return false;
    }

    domino.placed = true;
    domino.cells = cells;
    domino.orientation = orientation;
    domino.swapped = false;
    domino.confirmed = false;

    const firstValue = domino.a;
    const secondValue = domino.b;

    boardData[cells[0]].value = firstValue;
    boardData[cells[1]].value = secondValue;

    boardData[cells[0]].dominoId = id;
    boardData[cells[1]].dominoId = id;

    selectedDomino = id;

    return true;
}


// --------------------------------------------------
// REMOVE DOMINO
// --------------------------------------------------

function removeDomino(id) {

    const domino = dominoes.find(d => d.id === id);

    if (!domino || !domino.placed) return;

    domino.cells.forEach(index => {
        boardData[index].value = null;
        boardData[index].dominoId = null;
    });

    domino.placed = false;
    domino.cells = null;
    domino.confirmed = false;

    selectedDomino = null;

    render();
}


// --------------------------------------------------
// ROTATE SELECTED DOMINO
// --------------------------------------------------

function rotateSelected() {

    const domino = dominoes.find(d => d.id === selectedDomino);

    if (!domino || !domino.placed) return;

    const oldOrientation = domino.orientation;
    const oldSwapped = domino.swapped;

    const oldCells = [...domino.cells];

    oldCells.forEach(index => {
        boardData[index].value = null;
        boardData[index].dominoId = null;
    });

    const newOrientation =
        oldOrientation === "horizontal" ? "vertical" : "horizontal";

    const newCells = getDominoCells(oldCells[0], newOrientation);

    if (
        !newCells ||
        newCells.some(index =>
            boardData[index].value !== null
        )
    ) {

        oldCells.forEach((index, i) => {
            boardData[index].value = i === 0
                ? (oldSwapped ? domino.b : domino.a)
                : (oldSwapped ? domino.a : domino.b);

            boardData[index].dominoId = domino.id;
        });

        document.getElementById("status").textContent =
            "There isn't enough room to rotate that domino.";

        return;
    }

    domino.orientation = newOrientation;

    if (oldOrientation === "vertical") {
        domino.swapped = !domino.swapped;
    }

    domino.cells = newCells;

    const values = domino.swapped
        ? [domino.b, domino.a]
        : [domino.a, domino.b];

    newCells.forEach((index, i) => {
        boardData[index].value = values[i];
        boardData[index].dominoId = domino.id;
    });

    domino.confirmed = false;

    render();
}


// --------------------------------------------------
// SELECT / DESELECT DOMINO
// --------------------------------------------------

function selectDomino(id) {

    if (selectedDomino === id) {
        selectedDomino = null;
    } else {
        selectedDomino = id;
    }

    render();
}


// --------------------------------------------------
// PIP HALF RENDERING
// --------------------------------------------------

function renderDominoHalf(cell, domino, index) {

    const half = document.createElement("div");

    half.className = "domino-half";

    half.classList.add(domino.orientation);

    half.classList.add(index === 0 ? "first" : "second");

    if (selectedDomino === domino.id) {
        half.classList.add("selected");
    }

    const values = domino.swapped
        ? [domino.b, domino.a]
        : [domino.a, domino.b];

    half.appendChild(createPips(values[index]));

    half.addEventListener("click", event => {
        event.stopPropagation();
        selectDomino(domino.id);
    });

    half.addEventListener("dblclick", event => {
        event.stopPropagation();
        removeDomino(domino.id);
    });

    return half;
}


// --------------------------------------------------
// BOARD RENDER
// --------------------------------------------------

function renderBoard() {

    const board = document.getElementById("board");

    board.innerHTML = "";

    for (let i = 0; i < SIZE * SIZE; i++) {

        const cell = boardData[i];
        const row = Math.floor(i / SIZE);
        const col = i % SIZE;

        const element = document.createElement("div");
        element.className = "cell";

        const sameRegion = index =>
            boardData[index]?.regionId === cell.regionId;

        if (row === 0 || !sameRegion(i - SIZE)) {
            element.classList.add("region-top");
        }

        if (row === SIZE - 1 || !sameRegion(i + SIZE)) {
            element.classList.add("region-bottom");
        }

        if (col === 0 || !sameRegion(i - 1)) {
            element.classList.add("region-left");
        }

        if (col === SIZE - 1 || !sameRegion(i + 1)) {
            element.classList.add("region-right");
        }

        const region = regions[cell.regionId];

        if (i === getRegionCorner(region)) {

            const clue = document.createElement("span");
            clue.className = "region-clue";
            clue.textContent = getClue(region);

            element.appendChild(clue);
        }

        if (cell.dominoId !== null) {

            const domino = dominoes.find(
                d => d.id === cell.dominoId
            );

            const halfIndex = domino.cells.indexOf(i);

            element.appendChild(
                renderDominoHalf(cell, domino, halfIndex)
            );
        }

        element.addEventListener("click", () => {

            if (cell.dominoId !== null) {
                selectDomino(cell.dominoId);
                return;
            }

            if (
                selectedDomino !== null &&
                !dominoes.find(d => d.id === selectedDomino).placed
            ) {
                placeDomino(selectedDomino, i);
                render();
            }
        });

        element.addEventListener("dragover", event => {
            event.preventDefault();
            element.classList.add("drop-target");
        });

        element.addEventListener("dragleave", () => {
            element.classList.remove("drop-target");
        });

        element.addEventListener("drop", event => {

            event.preventDefault();

            element.classList.remove("drop-target");

            const id = draggedDomino;

            if (id !== null) {
                if (placeDomino(id, i)) {
                    render();
                }
            }

            draggedDomino = null;
        });

        board.appendChild(element);
    }

    updateDominoTools();
}


// --------------------------------------------------
// TRAY RENDER
// --------------------------------------------------

function renderTray() {

    const tray = document.getElementById("tray");

    tray.innerHTML = "";

    dominoes.forEach(domino => {

        if (domino.placed) return;

        const element = document.createElement("div");

        element.className = "tray-domino";
        element.draggable = true;

        if (selectedDomino === domino.id) {
            element.classList.add("selected");
        }

        const first = document.createElement("div");
        first.className = "tray-half";
        first.appendChild(createPips(domino.a));

        const second = document.createElement("div");
        second.className = "tray-half";
        second.appendChild(createPips(domino.b));

        element.appendChild(first);
        element.appendChild(second);

        element.addEventListener("click", () => {
            selectDomino(domino.id);
        });

        element.addEventListener("dragstart", event => {

            draggedDomino = domino.id;
            selectedDomino = domino.id;

            event.dataTransfer.setData(
                "text/plain",
                String(domino.id)
            );

            event.dataTransfer.effectAllowed = "move";
        });

        element.addEventListener("dragend", () => {
            draggedDomino = null;
        });

        tray.appendChild(element);
    });
}


// --------------------------------------------------
// FLOATING ROTATE / CONFIRM CONTROLS
// --------------------------------------------------

function updateDominoTools() {

    const tools = document.getElementById("dominoTools");

    const domino = dominoes.find(d => d.id === selectedDomino);

    if (!domino || !domino.placed) {
        tools.classList.remove("show");
        return;
    }

    const anchor = domino.cells[0];

    const row = Math.floor(anchor / SIZE);
    const col = anchor % SIZE;

    const cellSize = document.querySelector(".cell")?.getBoundingClientRect().width || 64;

    const left = Math.min(
        col * cellSize,
        SIZE * cellSize - 65
    );

    const top = Math.max(
        row * cellSize - 34,
        -30
    );

    tools.style.left = `${left}px`;
    tools.style.top = `${top}px`;

    tools.classList.add("show");
}


// --------------------------------------------------
// REGION RULE CHECKING
// --------------------------------------------------

function checkRegion(region) {

    const values = region.cells.map(
        index => boardData[index].value
    );

    if (values.some(value => value === null)) {
        return null;
    }

    const total = values.reduce((a, b) => a + b, 0);

    if (region.type === "sum") {
        return total === region.target;
    }

    if (region.type === "same") {
        return values.every(value => value === values[0]);
    }

    if (region.type === "different") {
        return new Set(values).size === values.length;
    }

    if (region.type === "less") {
        return total < region.target;
    }

    if (region.type === "greater") {
        return total > region.target;
    }

    return false;
}


// --------------------------------------------------
// PROGRESS / WIN CHECK
// --------------------------------------------------

function checkProgress() {

    const filled = boardData.filter(
        cell => cell.value !== null
    ).length;

    const completed = regions.filter(
        region => checkRegion(region) === true
    ).length;

    document.getElementById("progress").textContent =
        `${filled} / 36 squares filled`;

    if (filled !== 36) {

        document.getElementById("status").textContent =
            `${completed} / ${regions.length} regions satisfied`;

        return;
    }

    const allCorrect = regions.every(
        region => checkRegion(region) === true
    );

    document.getElementById("status").textContent =
        allCorrect
            ? "Puzzle completed! You solved it!"
            : "Some regions are incorrect. Try moving your dominoes.";
}


// --------------------------------------------------
// MAIN RENDER
// --------------------------------------------------

function render() {
    renderBoard();
    renderTray();
    checkProgress();
}


// --------------------------------------------------
// TUTORIAL
// --------------------------------------------------

function renderTutorial() {

    const content = document.getElementById("tutorialContent");
    const dots = document.getElementById("tutorialDots");

    const page = tutorials[tutorialPage];

    content.innerHTML = `
        <h2>${page.title}</h2>
        <p>${page.text}</p>
    `;

    dots.innerHTML = "";

    tutorials.forEach((item, index) => {

        const dot = document.createElement("button");

        dot.className = "tutorial-dot";

        if (index === tutorialPage) {
            dot.classList.add("active");
        }

        dot.addEventListener("click", () => {
            tutorialPage = index;
            renderTutorial();
        });

        dots.appendChild(dot);
    });

    document.getElementById("tutorialPrev").disabled =
        tutorialPage === 0;

    document.getElementById("tutorialNext").disabled =
        tutorialPage === tutorials.length - 1;
}

function openTutorial() {

    tutorialPage = 0;

    renderTutorial();

    document.getElementById("tutorialOverlay")
        .classList.add("show");
}

function closeTutorial() {

    document.getElementById("tutorialOverlay")
        .classList.remove("show");
}


// --------------------------------------------------
// BUTTON EVENTS
// --------------------------------------------------

document.getElementById("play").addEventListener("click", () => {

    difficulty = document.getElementById("difficulty").value;

    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("difficultyTitle").textContent =
        difficulty.charAt(0).toUpperCase() + difficulty.slice(1);

    generatePuzzle();
});

document.getElementById("back").addEventListener("click", () => {

    document.getElementById("game").style.display = "none";
    document.getElementById("menu").style.display = "flex";

    selectedDomino = null;
});

document.getElementById("newPuzzle").addEventListener("click", () => {
    generatePuzzle();
});

document.getElementById("rotateButton").addEventListener("click", rotateSelected);

document.getElementById("confirmButton").addEventListener("click", () => {

    const domino = dominoes.find(d => d.id === selectedDomino);

    if (domino) {
        domino.confirmed = true;
    }

    selectedDomino = null;

    render();
});

document.getElementById("tutorialButton")
    .addEventListener("click", openTutorial);

document.getElementById("tutorialClose")
    .addEventListener("click", closeTutorial);

document.getElementById("tutorialPrev")
    .addEventListener("click", () => {

        if (tutorialPage > 0) {
            tutorialPage--;
            renderTutorial();
        }
    });

document.getElementById("tutorialNext")
    .addEventListener("click", () => {

        if (tutorialPage < tutorials.length - 1) {
            tutorialPage++;
            renderTutorial();
        }
    });

document.getElementById("tutorialOverlay")
    .addEventListener("click", event => {

        if (event.target.id === "tutorialOverlay") {
            closeTutorial();
        }
    });

</script>
